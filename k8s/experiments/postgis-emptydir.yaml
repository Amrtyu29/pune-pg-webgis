# Q11, second run: the SAME PostGIS pod but with an emptyDir instead of a PersistentVolumeClaim.
# emptyDir lives and dies with the pod, so after "kubectl delete pod" the database comes back empty.
# Apply INSTEAD of 20-postgis-statefulset.yaml (delete that one first):
#   kubectl delete -f k8s/20-postgis-statefulset.yaml
#   kubectl apply  -f k8s/experiments/postgis-emptydir.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgis
  namespace: punepg
spec:
  serviceName: postgis
  replicas: 1
  selector:
    matchLabels:
      app: postgis
  template:
    metadata:
      labels:
        app: postgis
    spec:
      containers:
        - name: postgis
          image: postgis/postgis:16-3.5
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgis-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}                      # <- the only difference: scratch space that vanishes with the pod
