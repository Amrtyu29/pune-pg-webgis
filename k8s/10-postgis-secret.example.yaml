# EXAMPLE ONLY: the real Secret is created from .env by k8s/make-secret.ps1 and is never committed.
# A Secret keeps the password out of the Pod spec; the StatefulSet reads it with secretKeyRef.
# Values in a Secret are base64 ENCODED (not encrypted): "stringData" lets us write them in clear text
# and Kubernetes encodes them on creation.
apiVersion: v1
kind: Secret
metadata:
  name: postgis-secret
  namespace: punepg
type: Opaque
stringData:
  POSTGRES_USER: webgis
  POSTGRES_PASSWORD: change-me
  POSTGRES_DB: punepg
