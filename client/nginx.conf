# nginx config for the client image: static files, gzip, and Range requests enabled (default) so that
# MapLibre can read single tiles out of a .pmtiles file with "Range: bytes=…" requests.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/geo+json;

    location / {
        try_files $uri $uri/ =404;
    }

    # PMTiles archives are already compressed internally; serve as-is with the right type
    location ~* \.pmtiles$ {
        types { application/octet-stream pmtiles; }
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=3600";
    }
}
